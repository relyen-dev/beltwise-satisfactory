<section class="work-section">
  <div class="section-heading">
    <div>
      <h3>Recipe Machines</h3>
      <span>Machines shown here can affect recipe solving for this project.</span>
    </div>
  </div>
  @let rows = store.machineRows();
  @if (rows.length === 0) {
    <div class="empty-state">No recipe-solving machines are available in this dataset.</div>
  } @else {
    <div
      class="config-toggle-list config-toggle-list--wide config-toggle-list--machines"
      aria-label="Recipe machines"
    >
      @for (row of rows; track row.machine.id) {
        <label
          class="config-toggle-row machine-row"
          [class.config-toggle-row--enabled]="row.enabled"
          [class.config-toggle-row--disabled]="!row.enabled"
          [class.config-toggle-row--locked]="store.planLocked()"
        >
          <input
            class="config-toggle-row__control"
            type="checkbox"
            [ngModel]="row.enabled"
            [disabled]="store.planLocked()"
            [attr.aria-label]="row.toggleLabel"
            (ngModelChange)="store.setMachineEnabled(row.machine.id, $event)"
          />
          <span class="config-toggle-row__indicator" aria-hidden="true"></span>
          <span class="machine-icon-slot">
            <bw-game-icon
              [src]="row.iconSrc"
              [label]="row.machine.displayName"
              [size]="'lg'"
              [kind]="'machine'"
              [showTitle]="true"
            />
          </span>
          <span class="config-toggle-row__copy">
            <span class="machine-title-line">
              <span class="config-toggle-row__title">{{ row.machine.displayName }}</span>
            </span>
            <span class="machine-meta">
              <span class="machine-meta__chip">{{ row.typeLabel }}</span>
              @if (row.powerLabel) {
                <span class="machine-meta__chip machine-meta__chip--power">
                  {{ row.powerLabel }}
                </span>
              }
            </span>
          </span>
        </label>
      }
    </div>
  }
</section>
