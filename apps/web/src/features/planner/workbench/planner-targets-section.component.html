<section class="work-section">
  <div class="section-heading">
    <div>
      <h3>Production Targets</h3>
      <span>{{ configuredTargetCount() }} configured outputs solved together</span>
    </div>
    <button
      type="button"
      class="primary-action"
      title="Add product target"
      aria-label="Add product target"
      [disabled]="planConfig.editingLocked()"
      (click)="planConfig.targetCommands.add()"
    >
      Add product
    </button>
  </div>

  @let targetRows = targets();
  @if (targetRows.length === 0) {
    <div class="empty-state empty-state--action">
      <span>Add a product target to build a plan.</span>
      <button
        type="button"
        class="primary-action"
        title="Add product target"
        aria-label="Add product target"
        [disabled]="planConfig.editingLocked()"
        (click)="planConfig.targetCommands.add()"
      >
        Add product
      </button>
    </div>
  } @else {
    <div class="target-table" role="table" aria-label="Production target rows">
      <div class="target-row target-row--head" role="row">
        <span aria-hidden="true"></span>
        <span>Item</span>
        <span>Mode</span>
        <span>Rate / min</span>
        <span>Actions</span>
      </div>

      @for (target of targetRows; track target.id) {
        <div
          class="target-row"
          [class.target-row--needs-item]="target.itemId.length === 0"
          [class.target-row--dragging]="draggedTargetId() === target.id"
          [class.target-row--drop-before]="
            targetDropHint()?.targetId === target.id && targetDropHint()?.position === 'before'
          "
          [class.target-row--drop-after]="
            targetDropHint()?.targetId === target.id && targetDropHint()?.position === 'after'
          "
          role="row"
          (dragover)="handleTargetDragOver(target.id, $event)"
          (drop)="dropTarget(target.id, $event)"
        >
          <button
            type="button"
            class="target-drag-handle"
            title="Drag to reorder target"
            aria-label="Drag to reorder target"
            [disabled]="planConfig.editingLocked()"
            [attr.draggable]="planConfig.editingLocked() ? null : 'true'"
            (dragstart)="startTargetDrag(target.id, $event)"
            (dragend)="finishTargetDrag()"
            (keydown)="handleTargetDragKeydown(target.id, $event)"
          >
            <span aria-hidden="true"></span>
          </button>

          <div class="target-item-picker">
            <bw-target-item-picker
              [items]="planConfig.itemOptions()"
              [selectedItemId]="target.itemId"
              [disabled]="planConfig.editingLocked()"
              (itemSelected)="updateTargetItem(target.id, $event)"
            />
          </div>

          <label>
            <span class="sr-only">Target mode</span>
            <select
              [ngModel]="target.mode"
              [disabled]="planConfig.editingLocked()"
              (ngModelChange)="planConfig.targetCommands.updateMode(target.id, $event)"
            >
              <option value="fixed">Fixed</option>
              <option value="maximize">Maximize</option>
            </select>
          </label>

          <label>
            <span class="sr-only">Amount per minute</span>
            <input
              type="number"
              min="0"
              step="1"
              [disabled]="target.mode === 'maximize' || planConfig.editingLocked()"
              [ngModel]="target.amountPerMinute ?? 0"
              (ngModelChange)="updateTargetAmount(target.id, $event)"
            />
          </label>

          <div class="row-tools">
            <button
              type="button"
              class="row-icon-button row-icon-button--duplicate"
              title="Duplicate target"
              aria-label="Duplicate target"
              [disabled]="planConfig.editingLocked()"
              (click)="planConfig.targetCommands.duplicate(target)"
            >
              <span aria-hidden="true"></span>
            </button>
            <button
              type="button"
              class="row-icon-button row-icon-button--remove"
              title="Remove target"
              aria-label="Remove target"
              [disabled]="planConfig.editingLocked()"
              (click)="planConfig.targetCommands.remove(target.id)"
            >
              <span aria-hidden="true"></span>
            </button>
          </div>
        </div>
      }
    </div>
  }

  <div class="plan-notes">
    <div class="plan-notes__heading">
      <label for="plan-notes-textarea">Plan Notes</label>
      <button
        type="button"
        title="Clear plan notes"
        aria-label="Clear plan notes"
        [disabled]="planNotes().trim().length === 0"
        (click)="planConfig.noteCommands.clear()"
      >
        Clear
      </button>
    </div>
    <textarea
      id="plan-notes-textarea"
      rows="5"
      placeholder="Add plain-text planning notes for this factory."
      [ngModel]="planNotes()"
      (ngModelChange)="planConfig.noteCommands.set($event)"
    ></textarea>
  </div>
</section>
