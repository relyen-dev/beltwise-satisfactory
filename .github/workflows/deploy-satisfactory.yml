name: Deploy Satisfactory Planner

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-satisfactory.yml"
      - "angular.json"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "tsconfig.base.json"
      - "vitest.config.mjs"
      - "apps/web/**"
      - "e2e/**"
      - "packages/**"
      - "scripts/extract-satisfactory-data/**"
      - "data/generated/**"
      - "data/resource-limits/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-satisfactory.yml"
      - "angular.json"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.ts"
      - "tsconfig.base.json"
      - "vitest.config.mjs"
      - "apps/web/**"
      - "e2e/**"
      - "packages/**"
      - "scripts/extract-satisfactory-data/**"
      - "data/generated/**"
      - "data/resource-limits/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build app
        run: npm run build

      - name: Upload app build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: satisfactory-web-build
          path: dist/apps/web/browser
          if-no-files-found: error
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: validate
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Download app build
        uses: actions/download-artifact@v4
        with:
          name: satisfactory-web-build
          path: dist/apps/web/browser

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SATISFACTORY }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist/apps/web/browser
          api_location: ""
          output_location: ""
          skip_app_build: true
