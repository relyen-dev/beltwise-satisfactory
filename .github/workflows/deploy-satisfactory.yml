name: Deploy Satisfactory Planner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-satisfactory.yml"
      - "angular.json"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "vitest.config.mjs"
      - "apps/web/**"
      - "packages/**"
      - "scripts/extract-satisfactory-data/**"
      - "data/generated/**"
      - "data/resource-limits/**"

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SATISFACTORY }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist/apps/web/browser
          api_location: ""
          output_location: ""
          skip_app_build: true
